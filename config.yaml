# 定时浏览器自动化工具配置

# 数据库配置
database:
  path: "./data/browser_automation.db"

# 浏览器配置
browser:
  headless: false        # 设置为 false 即可显示浏览器界面
  slowMo: 1000           # 动作之间延迟 1000 毫秒（1秒），方便肉眼监控
  timeout: 30000         # 30秒超时
  userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# 调度配置
schedule:
  interval: 60000        # 每 1 分钟检查一次队列
  maxRetries: 2          # 失败重试次数
  resetHour: 0           # 每天 0 点重试计数清零

# 日志级别
logLevel: "info"
