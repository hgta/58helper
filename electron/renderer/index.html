<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>自动化浏览器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }
        
        /* 顶部工具栏 */
        .toolbar {
            position: fixed;
            top: 0;
            left: 280px;
            right: 0;
            height: 42px;
            background: #252542;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            border-bottom: 1px solid #333;
            -webkit-app-region: drag;
            z-index: 100;
        }
        
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-app-region: no-drag;
        }
        
        .toolbar-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 5px;
            background: #3a3a5c;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .toolbar-btn:hover {
            background: #4a4a6c;
        }
        
        .toolbar-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .zoom-display {
            min-width: 45px;
            text-align: center;
            font-size: 11px;
            color: #888;
            background: #1e1e35;
            padding: 4px 6px;
            border-radius: 4px;
        }
        
        .url-bar {
            flex: 1;
            height: 30px;
            background: #1e1e35;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 0 12px;
            color: #fff;
            font-size: 13px;
            -webkit-app-region: no-drag;
            -webkit-user-select: text;
            user-select: text;
        }
        
        .url-bar:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .window-controls {
            display: flex;
            gap: 6px;
            -webkit-app-region: no-drag;
        }
        
        .win-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        
        .win-btn.close { background: #ff5f56; }
        .win-btn.minimize { background: #ffbd2e; }
        .win-btn.maximize { background: #27ca40; }
        
        /* 标签栏 */
        .tabbar {
            position: fixed;
            top: 42px;
            left: 280px;
            right: 0;
            height: 34px;
            background: #1f1f38;
            display: flex;
            align-items: flex-end;
            padding: 0 8px;
            gap: 4px;
            overflow-x: auto;
            overflow-y: hidden;
            border-bottom: 1px solid #333;
            -webkit-app-region: drag;
            z-index: 99;
        }
        
        .tabbar::-webkit-scrollbar { height: 0; }
        
        .tab-item {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 200px;
            min-width: 110px;
            height: 30px;
            padding: 0 8px 0 10px;
            border-radius: 6px 6px 0 0;
            background: #1a1a2e;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            -webkit-app-region: no-drag;
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }
        
        .tab-item:hover { color: #ccc; }
        
        .tab-item.active {
            background: #252542;
            color: #fff;
            box-shadow: inset 0 2px 0 #667eea;
        }
        
        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .tab-close {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 15px;
            padding: 0 2px;
            line-height: 1;
            flex-shrink: 0;
        }
        
        .tab-close:hover { color: #f45c43; }
        
        /* 侧边栏 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            background: #1a1a2e;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            z-index: 101;
        }
        
        .sidebar-header {
            padding: 12px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .sidebar-header h1 {
            font-size: 15px;
            margin-bottom: 2px;
        }
        
        .sidebar-header p {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 10px;
            background: #252542;
        }
        
        /* 任务执行计时器 */
        .timer-bar {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px 14px;
            background: linear-gradient(135deg, #1e1e35, #252542);
            border-bottom: 1px solid #333;
            border-top: 1px solid #333;
        }
        
        .timer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        
        .timer-value.eta {
            color: #ffd200;
            font-size: 16px;
            min-width: 76px;
        }
        
        .timer-value.eta.calculating {
            color: #888;
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: normal;
        }
        
        .timer-icon {
            font-size: 16px;
        }
        
        .timer-label {
            font-size: 11px;
            color: #888;
            flex: 1;
        }
        
        .timer-value {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #667eea;
            font-variant-numeric: tabular-nums;
            min-width: 82px;
            text-align: right;
        }
        
        .timer-value.active {
            color: #38ef7d;
            animation: timerPulse 1s infinite;
        }
        
        @keyframes timerPulse {
            0%, 100% { text-shadow: 0 0 4px rgba(56, 239, 125, 0.4); }
            50% { text-shadow: 0 0 14px rgba(56, 239, 125, 0.9); }
        }
        
        .stat-item {
            text-align: center;
            padding: 8px 4px;
            background: #1e1e35;
            border-radius: 6px;
        }
        
        .stat-item .value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-item .label {
            font-size: 9px;
            color: #888;
            margin-top: 2px;
        }
        
        .control-section {
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        
        .control-section h3 {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
        }
        
        .control-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .btn:hover {
            transform: translateY(-1px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            color: #4a3200;
        }
        
        .btn-secondary {
            background: #3a3a5c;
            color: #fff;
        }
        
        .btn:disabled,
        .btn[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 任务状态徽标 */
        .task-status-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
            display: none;
        }
        
        .task-status-badge.show {
            display: inline-block;
        }
        
        .task-status-badge.running {
            background: rgba(56, 239, 125, 0.18);
            color: #38ef7d;
        }
        
        .task-status-badge.paused {
            background: rgba(255, 210, 0, 0.18);
            color: #ffd200;
        }
        
        .task-status-badge.stopping {
            background: rgba(244, 92, 67, 0.18);
            color: #f45c43;
        }
        
        .timer-value.paused {
            color: #ffd200;
            animation: none;
        }
        
        /* 任务列表 */
        .task-section {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        .task-header {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .task-header h3 {
            font-size: 12px;
        }
        
        .task-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .task-item {
            background: #252542;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 6px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .task-item:hover {
            border-color: #444;
        }
        
        .task-item.executing {
            border-color: #667eea;
            animation: pulse 2s infinite;
        }
        
        .task-item.completed {
            border-color: #38ef7d;
        }
        
        .task-item.selected {
            border-color: #667eea;
            background: #2a2a4a;
        }
        
        .task-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .task-header-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .task-name {
            font-size: 13px;
            font-weight: 500;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .task-priority {
            font-size: 10px;
            font-weight: 600;
            color: #667eea;
            background: rgba(102, 126, 234, 0.15);
            padding: 2px 6px;
            border-radius: 3px;
            min-width: 24px;
            text-align: center;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(102, 126, 234, 0); }
        }
        
        .task-url {
            font-size: 11px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        
        .task-selectors {
            font-size: 9px;
            color: #888;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }
        
        .task-actions {
            display: flex;
            gap: 4px;
        }
        
        .btn-small {
            padding: 5px 8px;
            font-size: 10px;
        }
        
        /* 日志 */
        .log-section {
            height: 180px;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        
        .log-header {
            padding: 6px 10px;
            background: #252542;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .log-header h4 {
            font-size: 11px;
        }
        
        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            background: #0d0d1a;
        }
        
        .log-item {
            padding: 2px 0;
            border-bottom: 1px solid #222;
        }
        
        .log-time {
            color: #666;
            margin-right: 6px;
        }
        
        .log-success { color: #38ef7d; }
        .log-error { color: #f45c43; }
        .log-info { color: #fff; }
        .log-warning { color: #f9ca24; }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #252542;
            border-radius: 10px;
            padding: 20px;
            width: 380px;
            max-width: 90%;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        .form-group label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 4px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: #1e1e35;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 13px;
            -webkit-user-select: text;
            user-select: text;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            min-height: 70px;
            resize: vertical;
            font-family: monospace;
        }

        /* 多步骤样式 */
        .modal-content {
            width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .steps-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            background: #1e1e35;
        }

        .step-item {
            background: #252542;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .step-number {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
        }

        .step-remove {
            background: none;
            border: none;
            color: #f45c43;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }

        .step-remove:hover {
            color: #ff6b6b;
        }

        .step-url {
            font-size: 12px;
            color: #fff;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .step-selectors {
            font-size: 10px;
            color: #888;
        }

        .btn-add-step {
            background: #3a3a5c;
            color: #667eea;
            border: 1px dashed #667eea;
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
        }

        .btn-add-step:hover {
            background: #4a4a6c;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <button class="toolbar-btn" id="btn-back" title="后退">←</button>
            <button class="toolbar-btn" id="btn-forward" title="前进">→</button>
            <button class="toolbar-btn" id="btn-refresh" title="刷新">⟳</button>
            <span style="width: 1px; height: 20px; background: #444; margin: 0 4px;"></span>
            <button class="toolbar-btn" id="btn-zoom-out" title="缩小">−</button>
            <div class="zoom-display" id="zoom-level">100%</div>
            <button class="toolbar-btn" id="btn-zoom-in" title="放大">+</button>
        </div>
        <input type="text" class="url-bar" id="url-input" placeholder="输入网址...">
        <div class="window-controls">
            <button class="win-btn minimize" id="win-min"></button>
            <button class="win-btn maximize" id="win-max"></button>
            <button class="win-btn close" id="win-close"></button>
        </div>
    </div>
    
    <!-- 标签栏 -->
    <div class="tabbar" id="tabbar"></div>
    
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>🤖 自动化浏览器</h1>
            <p>任务管理与自动执行</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="value" id="stat-total">0</div>
                <div class="label">任务</div>
            </div>
            <div class="stat-item">
                <div class="value" id="stat-enabled">0</div>
                <div class="label">启用</div>
            </div>
            <div class="stat-item">
                <div class="value" id="stat-today">0</div>
                <div class="label">今日</div>
            </div>
            <div class="stat-item">
                <div class="value" id="stat-success">0</div>
                <div class="label">成功</div>
            </div>
        </div>
        
        <!-- 当前任务执行耗时计时器 + 预计剩余时间 -->
        <div class="timer-bar">
            <div class="timer-row">
                <span class="timer-icon">⏱️</span>
                <span class="timer-label">已执行</span>
                <span class="task-status-badge" id="task-status-badge"></span>
                <span class="timer-value" id="task-timer">00:00:00</span>
            </div>
            <div class="timer-row" id="task-eta-row" style="display: none;">
                <span class="timer-icon">⏳</span>
                <span class="timer-label" id="task-eta-label">预计剩余</span>
                <span class="timer-value eta" id="task-eta">--:--:--</span>
            </div>
        </div>
        
        <div class="control-section">
            <h3>⚡ 快捷操作</h3>
            <div class="control-btns">
                <button class="btn btn-success" id="btn-execute-all">▶ 执行全部</button>
                <button class="btn btn-warning" id="btn-pause-task" style="display: none;">⏸ 暂停</button>
                <button class="btn btn-danger" id="btn-stop-task" style="display: none;">⏹ 停止</button>
                <button class="btn btn-primary" id="btn-add-task">+ 添加任务</button>
            </div>
        </div>
        
        <div class="task-section">
            <div class="task-header">
                <h3>📋 任务列表</h3>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <input type="checkbox" id="select-all" class="task-checkbox" onchange="toggleSelectAll()">
                    <label for="select-all" style="font-size: 11px; color: #888; cursor: pointer;">全选</label>
                    <button class="btn btn-success btn-small" id="btn-batch-execute" onclick="executeSelectedTasks()">批量执行</button>
                </div>
            </div>
            <div class="task-list" id="task-list">
                <div style="text-align: center; padding: 15px; color: #666;">加载中...</div>
            </div>
        </div>
        
        <div class="log-section">
            <div class="log-header">
                <h4>📜 执行日志</h4>
                <div style="display: flex; gap: 6px;">
                    <button class="btn btn-secondary btn-small" id="btn-export-log" title="导出日志文件，便于分享排查">导出日志</button>
                    <button class="btn btn-secondary btn-small" id="btn-open-log-dir" title="打开日志所在文件夹">打开目录</button>
                    <button class="btn btn-secondary btn-small" id="btn-clear-log">清空</button>
                </div>
            </div>
            <div class="log-container" id="log-container"></div>
        </div>
    </div>
    
    <!-- 添加/编辑任务模态框 -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">添加新任务</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label>任务名称</label>
                    <input type="text" id="task-name" placeholder="给任务起个名字">
                </div>
                <div class="form-group">
                    <label>访问步骤（每个步骤间隔5秒）</label>
                    <div class="steps-container" id="steps-container">
                        <!-- 步骤将动态添加 -->
                    </div>
                    <button type="button" class="btn btn-add-step" onclick="addStep()">+ 添加步骤</button>
                </div>
                <div class="form-group">
                    <label>优先级</label>
                    <input type="number" id="task-priority" value="1" min="1">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">保存任务</button>
            </form>
        </div>
    </div>

    <!-- 步骤编辑模态框 -->
    <div class="modal" id="step-modal">
        <div class="modal-content" style="width: 400px;">
            <div class="modal-header">
                <h3 id="step-modal-title">添加步骤</h3>
                <button class="modal-close" id="step-modal-close">&times;</button>
            </div>
            <form id="step-form">
                <div class="form-group">
                    <label>网页地址</label>
                    <input type="url" id="step-url" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>按钮选择器（每行一个，可选）</label>
                    <textarea id="step-selectors" placeholder=".btn-submit&#10;#submit-btn"></textarea>
                </div>
                <div class="form-group">
                    <label style="display: inline-flex; align-items: flex-start; gap: 6px; cursor: pointer; white-space: nowrap;">
                        <input type="checkbox" id="step-iterate-all">
                        轮询页面所有相同元素
                    </label>
                </div>
                <div class="form-group" id="iterate-global-group" style="display: none;">
                    <label style="display: inline-flex; align-items: flex-start; gap: 6px; cursor: pointer; white-space: nowrap;">
                        <input type="checkbox" id="step-iterate-global">
                        全局唯一计数
                    </label>
                </div>
                <div class="form-group" id="iterate-start-group" style="display: none;">
                    <label>从第几个元素开始轮询（默认 1）</label>
                    <input type="number" id="step-iterate-start-index" value="1" min="1">
                </div>
                <div class="form-group" id="iterate-interval-group" style="display: none;">
                    <label>轮询间隔（秒）</label>
                    <input type="number" id="step-iterate-interval" value="10" min="1">
                    <div id="batch-local-group">
                        <label>每组连续点击数（个，可选填）</label>
                        <input type="number" id="step-iterate-batch-size" placeholder="10" min="1">
                        <label>组间休息（秒，可选填）</label>
                        <input type="number" id="step-iterate-batch-interval" placeholder="60" min="1">
                    </div>
                    <div id="batch-global-group" style="display: none;">
                        <label>全局连续点击个数（个）</label>
                        <input type="number" id="step-iterate-global-size" placeholder="10" min="1">
                        <label>连续点击后休息时间（秒）</label>
                        <input type="number" id="step-iterate-global-interval" placeholder="60" min="1">
                    </div>
                    <label style="display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #ccc; cursor: pointer;">
                        <input type="checkbox" id="step-iterate-open-tabs">
                        每个元素在新标签页中执行后续步骤
                    </label>
                </div>
                <div class="form-group">
                    <label>确认框按钮（每行一个，可选）</label>
                    <textarea id="step-confirm-selectors" placeholder=".btn-confirm&#10;确定"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">保存步骤</button>
            </form>
        </div>
    </div>
    
    <script>
        const { ipcRenderer } = require('electron');
        
        let tasks = [];
        let selectedTasks = [];
        let isExecuting = false;
        let currentZoom = 1;
        let currentSteps = [];  // 当前编辑的步骤列表
        let editingStepIndex = -1;  // 当前编辑的步骤索引，-1表示新增
        let taskStatus = 'idle';   // idle | running | paused | stopping
        let taskProgress = { done: 0, total: 0, label: '' };  // 主进程上报的工作进度
        let taskDurations = {};    // { [taskId]: { last, avg, count } } 历史耗时
        
        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            loadTasks();
            loadStats();
            setupEventListeners();
            initTabs();
            initTaskStatus();
            loadTaskDurations();
            addLog('应用已启动', 'info');
        });

        // 与主进程同步一次任务控制状态（例如界面刷新时任务仍在跑）
        async function initTaskStatus() {
            try {
                const r = await ipcRenderer.invoke('task-control-state');
                if (r && r.success && r.state) {
                    applyTaskStatus(r.state.status, r.state.progress);
                }
            } catch (e) {}
        }
        
        // 设置事件监听
        function setupEventListeners() {
            // 轮询勾选联动：勾选时显示间隔输入框和全局计数选项
            document.getElementById('step-iterate-all').addEventListener('change', (e) => {
                document.getElementById('iterate-interval-group').style.display =
                    e.target.checked ? 'block' : 'none';
                document.getElementById('iterate-start-group').style.display =
                    e.target.checked ? 'block' : 'none';
                document.getElementById('iterate-global-group').style.display =
                    e.target.checked ? 'block' : 'none';
                if (!e.target.checked) {
                    document.getElementById('step-iterate-global').checked = false;
                    document.getElementById('step-iterate-start-index').value = 1;
                }
                updateBatchGroupVisibility();
            });

            // 全局唯一计数勾选联动：切换局部分批 / 全局分批输入框
            document.getElementById('step-iterate-global').addEventListener('change', updateBatchGroupVisibility);

            
            // 窗口控制
            document.getElementById('win-min').addEventListener('click', () => {
                ipcRenderer.send('window-minimize');
            });
            document.getElementById('win-max').addEventListener('click', () => {
                ipcRenderer.send('window-maximize');
            });
            document.getElementById('win-close').addEventListener('click', () => {
                ipcRenderer.send('window-close');
            });
            
            // 浏览器控制
            document.getElementById('btn-back').addEventListener('click', async () => {
                await ipcRenderer.invoke('browser-back');
            });
            document.getElementById('btn-forward').addEventListener('click', async () => {
                await ipcRenderer.invoke('browser-forward');
            });
            document.getElementById('btn-refresh').addEventListener('click', async () => {
                await ipcRenderer.invoke('browser-refresh');
            });
            
            // 缩放控制
            document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(currentZoom + 0.1));
            document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(currentZoom - 0.1));
            
            // URL输入
            document.getElementById('url-input').addEventListener('keypress', async (e) => {
                if (e.key === 'Enter') {
                    let url = e.target.value.trim();
                    if (!url.startsWith('http')) {
                        url = 'https://' + url;
                    }
                    await ipcRenderer.invoke('browser-navigate', url);
                }
            });
            
            // 任务控制
            document.getElementById('btn-execute-all').addEventListener('click', executeAllTasks);
            // 暂停 / 继续
            document.getElementById('btn-pause-task').addEventListener('click', async () => {
                const btn = document.getElementById('btn-pause-task');
                if (taskStatus === 'paused') {
                    btn.disabled = true;
                    try {
                        const r = await ipcRenderer.invoke('task-resume');
                        addLog(r.success ? '▶ 任务已继续' : '继续失败：当前没有暂停的任务', r.success ? 'info' : 'warning');
                    } finally {
                        btn.disabled = false;
                    }
                } else if (taskStatus === 'running') {
                    btn.disabled = true;
                    try {
                        const r = await ipcRenderer.invoke('task-pause');
                        addLog(r.success ? '⏸ 任务已暂停（点「继续」恢复）' : '暂停失败：当前没有运行中的任务', r.success ? 'warning' : 'warning');
                    } finally {
                        btn.disabled = false;
                    }
                }
            });
            // 停止
            document.getElementById('btn-stop-task').addEventListener('click', async () => {
                if (!confirm('确定停止当前任务？正在执行的任务会被中断。')) return;
                await ipcRenderer.invoke('task-stop');
            });
            document.getElementById('btn-add-task').addEventListener('click', () => {
                // 重置表单为添加模式
                document.getElementById('task-id').value = '';
                document.getElementById('task-form').reset();
                currentSteps = [];
                renderSteps();
                document.getElementById('task-priority').value = tasks.length + 1;
                document.getElementById('modal-title').textContent = '添加新任务';
                document.getElementById('add-modal').classList.add('show');
                ipcRenderer.send('modal-show');
                setTimeout(() => {
                    document.getElementById('task-name').focus();
                }, 100);
            });
            document.getElementById('modal-close').addEventListener('click', () => {
                document.getElementById('add-modal').classList.remove('show');
                ipcRenderer.send('modal-hide');
            });
            // 点击模态框背景关闭
            document.getElementById('add-modal').addEventListener('click', (e) => {
                if (e.target.id === 'add-modal') {
                    document.getElementById('add-modal').classList.remove('show');
                    ipcRenderer.send('modal-hide');
                }
            });
            document.getElementById('btn-clear-log').addEventListener('click', () => {
                document.getElementById('log-container').innerHTML = '';
            });
            // 导出日志到文件
            document.getElementById('btn-export-log').addEventListener('click', async () => {
                const btn = document.getElementById('btn-export-log');
                btn.disabled = true;
                try {
                    const uiLogText = document.getElementById('log-container').innerText || '';
                    const result = await ipcRenderer.invoke('logs-export', uiLogText);
                    if (result.success) {
                        addLog(`日志已导出: ${result.path}`, 'success');
                    } else if (result.canceled) {
                        // 用户取消，不提示
                    } else {
                        addLog(`导出日志失败: ${result.error}`, 'error');
                    }
                } catch (e) {
                    addLog(`导出日志失败: ${e.message}`, 'error');
                } finally {
                    btn.disabled = false;
                }
            });
            // 打开日志目录
            document.getElementById('btn-open-log-dir').addEventListener('click', async () => {
                const result = await ipcRenderer.invoke('logs-open-dir');
                if (result.success) {
                    addLog(`日志目录: ${result.path}`, 'info');
                } else {
                    addLog(`打开日志目录失败: ${result.error}`, 'error');
                }
            });
            
            // 表单提交
            document.getElementById('task-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const taskId = document.getElementById('task-id').value;
                const name = document.getElementById('task-name').value.trim();
                const priority = parseInt(document.getElementById('task-priority').value);
                
                if (currentSteps.length === 0) {
                    addLog('请至少添加一个步骤', 'error');
                    return;
                }
                
                // 检查任务名称是否重复
                const checkResult = await ipcRenderer.invoke('check-task-name', name, taskId ? parseInt(taskId) : null);
                if (checkResult.success && checkResult.exists) {
                    const confirmed = confirm(`任务名称"${name}"已存在，是否继续保存？`);
                    if (!confirmed) {
                        return;
                    }
                }
                
                let result;
                if (taskId) {
                    // 编辑模式
                    result = await ipcRenderer.invoke('url-update', parseInt(taskId), {
                        name,
                        steps: currentSteps,
                        priority
                    });
                } else {
                    // 添加模式
                    result = await ipcRenderer.invoke('url-create', {
                        name,
                        steps: currentSteps,
                        priority,
                        enabled: true
                    });
                }
                
                if (result.success) {
                    document.getElementById('add-modal').classList.remove('show');
                    ipcRenderer.send('modal-hide');
                    loadTasks();
                    addLog(taskId ? '任务更新成功' : '任务添加成功', 'success');
                    document.getElementById('task-form').reset();
                    document.getElementById('task-id').value = '';
                } else {
                    addLog('操作失败: ' + result.error, 'error');
                }
            });
            
            // 监听浏览器URL变化
            ipcRenderer.on('browser-url-changed', (event, url) => {
                document.getElementById('url-input').value = url;
            });
            
            ipcRenderer.on('browser-title-changed', (event, title) => {
                document.title = title + ' - 自动化浏览器';
            });
            
            // 监听缩放变化
            ipcRenderer.on('zoom-changed', (event, zoomLevel) => {
                currentZoom = zoomLevel;
                updateZoomDisplay();
            });
            
            // 主进程日志实时推送到日志面板
            ipcRenderer.on('log-message', (event, entry) => {
                if (entry && entry.message) {
                    addLog(entry.message, entry.level === 'error' ? 'error' : entry.level === 'warn' ? 'warning' : 'info');
                }
            });

            // 标签栏：主进程推送 tab 列表变化
            ipcRenderer.on('tabs-changed', (event, data) => {
                renderTabs(data.tabs || [], data.activeId);
            });

            // 任务控制状态（运行/暂停/停止）+ 执行进度 实时同步到 UI
            ipcRenderer.on('task-status', (event, state) => {
                applyTaskStatus(state && state.status, state && state.progress);
            });

            // 主进程推送任务结束（含被用户停止）
            ipcRenderer.on('task-completed', (event, data) => {
                if (data && data.aborted) {
                    addLog('⏹ 任务已停止', 'warning');
                }
            });
        }

        // ===== 标签栏 =====
        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // 初始加载标签列表（主进程可能在渲染层就绪前已创建主标签页）
        async function initTabs() {
            try {
                const result = await ipcRenderer.invoke('tab-get-all');
                if (result.success) {
                    renderTabs(result.tabs || [], result.activeId);
                }
            } catch (e) {}
        }

        function renderTabs(tabs, activeId) {
            const bar = document.getElementById('tabbar');
            bar.innerHTML = tabs.map(t => `
                <div class="tab-item ${t.id === activeId ? 'active' : ''}" onclick="activateTab('${t.id}')" title="${escapeHtml(t.title)}">
                    <span>${t.kind === 'main' ? '🏠' : '📄'}</span>
                    <span class="tab-title">${escapeHtml(t.title || '新标签页')}</span>
                    ${t.closable ? `<button class="tab-close" title="关闭标签页" onclick="event.stopPropagation(); closeTab('${t.id}')">&times;</button>` : ''}
                </div>
            `).join('');
        }

        function activateTab(id) {
            ipcRenderer.invoke('tab-activate', id);
        }

        function closeTab(id) {
            ipcRenderer.invoke('tab-close', id);
        }
        
        // 缩放功能
        async function setZoom(level) {
            currentZoom = Math.max(0.25, Math.min(5, level));
            currentZoom = Math.round(currentZoom * 100) / 100;
            await ipcRenderer.invoke('browser-set-zoom', currentZoom);
            updateZoomDisplay();
        }
        
        function updateZoomDisplay() {
            document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';
        }
        
        // 加载任务
        async function loadTasks() {
            const result = await ipcRenderer.invoke('url-get-all');
            if (result.success) {
                tasks = result.data;
                renderTasks();
                updateStats();
            }
        }
        
        // 毫秒 → 紧凑时长（12:34 / 1:02:33），用于任务卡片
        function formatShort(ms) {
            const totalSec = Math.max(0, Math.round((Number(ms) || 0) / 1000));
            if (!totalSec) return '';
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            return `${m}:${String(s).padStart(2, '0')}`;
        }
        
        // 任务卡片上的耗时提示（上次 / 平均）
        function durationHint(taskId) {
            const d = taskDurations[String(taskId)];
            if (!d) return '';
            const last = Number(d.last) || 0;
            const avg = Number(d.avg) || 0;
            if (!last && !avg) return '';
            const parts = [];
            if (last) parts.push(`上次 ${formatShort(last)}`);
            if (avg && d.count > 1) parts.push(`平均 ${formatShort(avg)}`);
            return parts.length ? ` · 耗时 ${parts.join(' / ')}` : '';
        }
        
        // 拉取历史耗时统计
        async function loadTaskDurations(rerender = true) {
            try {
                const r = await ipcRenderer.invoke('task-durations-get');
                if (r && r.success) {
                    taskDurations = r.data || {};
                    if (rerender) renderTasks();
                }
            } catch (e) { /* 忽略：估算信息拿不到不影响主流程 */ }
        }
        
        // 渲染任务列表
        function renderTasks() {
            const container = document.getElementById('task-list');
            
            if (tasks.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 15px; color: #666;">暂无任务，点击上方按钮添加</div>';
                return;
            }
            
            container.innerHTML = tasks.map((task, i) => `
                <div class="task-item ${selectedTasks.includes(task.id) ? 'selected' : ''}" id="task-${task.id}">
                    <div class="task-header-row">
                        <input type="checkbox" class="task-checkbox" 
                            ${selectedTasks.includes(task.id) ? 'checked' : ''} 
                            onchange="toggleTaskSelection(${task.id})">
                        <span class="task-priority">P${task.priority || i + 1}</span>
                        <div class="task-name">${task.name || `任务 ${i + 1}`}</div>
                    </div>
                    <div class="task-selectors">${task.steps?.length || 0} 个步骤${durationHint(task.id)}</div>
                    <div class="task-actions">
                        <button class="btn btn-success btn-small" onclick="executeTask(${task.id})">执行</button>
                        <button class="btn btn-primary btn-small" onclick="editTask(${task.id})">编辑</button>
                        <button class="btn btn-secondary btn-small" onclick="toggleTask(${task.id})">${task.enabled ? '禁用' : '启用'}</button>
                        <button class="btn btn-danger btn-small" onclick="deleteTask(${task.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 加载统计
        async function loadStats() {
            const result = await ipcRenderer.invoke('get-stats');
            if (result.success) {
                document.getElementById('stat-total').textContent = result.data.totalUrls;
                document.getElementById('stat-enabled').textContent = result.data.enabledUrls;
                document.getElementById('stat-today').textContent = result.data.todayExecutions;
                document.getElementById('stat-success').textContent = result.data.todaySuccess;
            }
        }
        
        function updateStats() {
            document.getElementById('stat-total').textContent = tasks.length;
            document.getElementById('stat-enabled').textContent = tasks.filter(t => t.enabled).length;
        }
        
        // ===== 任务执行计时器 =====
        let taskTimerStart = null;
        let taskTimerInterval = null;
        let batchRunning = false; // 批量执行时由外层统一管理计时器，避免单任务启停干扰
        let taskElapsedOffset = 0; // 已扣除的暂停时长（毫秒）
        let taskPausedAt = null;   // 进入暂停的时刻

        function formatElapsed(ms) {
            const totalSec = Math.floor(ms / 1000);
            const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const s = String(totalSec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 当前任务的有效耗时（不含暂停时间）
        function getTaskElapsedMs() {
            if (taskTimerStart === null) return 0;
            let elapsed = Date.now() - taskTimerStart - taskElapsedOffset;
            if (taskPausedAt !== null) {
                elapsed -= (Date.now() - taskPausedAt); // 暂停期间不计时
            }
            return Math.max(0, elapsed);
        }

        function updateTaskTimer() {
            const el = document.getElementById('task-timer');
            if (el) {
                el.textContent = taskTimerStart === null ? '00:00:00' : formatElapsed(getTaskElapsedMs());
            }
            updateTaskEta();
        }

        /**
         * 预计剩余时间：按「已完成单元 / 总单元」的实测速率外推。
         * 单元由主进程上报（一个元素或一个普通步骤算一个），随执行不断校正，越跑越准。
         */
        function computeEtaMs() {
            const { done, total } = taskProgress;
            if (!total || done <= 0) return null;      // 还没完成任何单元，无法估速率
            if (done >= total) return 0;               // 单元已跑完，只剩收尾
            const elapsed = getTaskElapsedMs();
            if (elapsed <= 0) return null;
            return (elapsed / done) * (total - done);
        }

        function updateTaskEta() {
            const row = document.getElementById('task-eta-row');
            const labelEl = document.getElementById('task-eta-label');
            const valueEl = document.getElementById('task-eta');
            if (!row || !labelEl || !valueEl) return;

            const active = taskTimerStart !== null && taskStatus !== 'idle';
            if (!active) {
                row.style.display = 'none';
                return;
            }
            row.style.display = '';

            const { done, total, label } = taskProgress;
            const eta = computeEtaMs();

            // 进度行改成展示「当前阶段」，跟主进程日志里的格式一致；
            // 全局进度 done/total 放到 hover 提示里，避免数字互相打架
            if (label) {
                labelEl.textContent = `预计剩余 · ${label}`;
            } else {
                const progText = total > 0 ? ` ${done}/${total}` : '';
                labelEl.textContent = `预计剩余${progText}`;
            }

            const tooltipParts = [];
            if (total > 0) tooltipParts.push(`总进度 ${done}/${total}`);

            if (eta === null) {
                valueEl.textContent = '计算中…';
                valueEl.classList.add('calculating');
                row.title = total > 0
                    ? `已完成 ${done}/${total}，还需采集几个样本才能估算`
                    : '等待任务上报进度…';
                return;
            }

            valueEl.classList.remove('calculating');
            if (eta <= 0) {
                valueEl.textContent = '即将完成';
                valueEl.classList.add('calculating');
                row.title = tooltipParts.length ? tooltipParts.join(' · ') : '剩余工作单元已全部完成';
            } else {
                valueEl.textContent = formatElapsed(eta);
                const finishAt = new Date(Date.now() + eta);
                const hh = String(finishAt.getHours()).padStart(2, '0');
                const mi = String(finishAt.getMinutes()).padStart(2, '0');
                const head = `按当前速度，预计 ${hh}:${mi} 完成`;
                const tail = '；暂停时不计时';
                row.title = [head, ...tooltipParts, tail].filter(Boolean).join(' · ');
            }
        }

        function startTaskTimer() {
            if (taskTimerInterval) return; // 已在运行则不重置
            taskTimerStart = Date.now();
            taskElapsedOffset = 0;
            taskPausedAt = null;
            updateTaskTimer();
            taskTimerInterval = setInterval(updateTaskTimer, 1000);
            const el = document.getElementById('task-timer');
            if (el) el.classList.add('active');
        }

        function stopTaskTimer() {
            if (taskTimerInterval) {
                clearInterval(taskTimerInterval);
                taskTimerInterval = null;
            }
            updateTaskTimer(); // 定格最终耗时
            taskPausedAt = null;
            const el = document.getElementById('task-timer');
            if (el) {
                el.classList.remove('active');
                el.classList.remove('paused');
            }
        }

        // ===== 任务控制（暂停 / 继续 / 停止） =====
        const TASK_STATUS_TEXT = { running: '运行中', paused: '已暂停', stopping: '正在停止' };

        function applyTaskStatus(status, progress) {
            if (!status) return;
            const prev = taskStatus;
            taskStatus = status;

            if (progress) {
                taskProgress = {
                    done: Number(progress.done) || 0,
                    total: Number(progress.total) || 0,
                    label: progress.label || ''
                };
            }
            // 任务结束后清空进度，避免下次执行前残留旧数据
            if (status === 'idle') {
                taskProgress = { done: 0, total: 0, label: '' };
            }

            const active = status === 'running' || status === 'paused' || status === 'stopping';
            const badge = document.getElementById('task-status-badge');
            const pauseBtn = document.getElementById('btn-pause-task');
            const stopBtn = document.getElementById('btn-stop-task');
            const executeBtn = document.getElementById('btn-execute-all');
            const batchBtn = document.getElementById('btn-batch-execute');
            const timerEl = document.getElementById('task-timer');

            if (badge) {
                if (active) {
                    badge.textContent = TASK_STATUS_TEXT[status] || status;
                    badge.className = `task-status-badge show ${status}`;
                } else {
                    badge.className = 'task-status-badge';
                }
            }

            if (pauseBtn) {
                pauseBtn.style.display = active ? '' : 'none';
                pauseBtn.textContent = status === 'paused' ? '▶ 继续' : '⏸ 暂停';
                pauseBtn.disabled = status === 'stopping';
            }
            if (stopBtn) {
                stopBtn.style.display = active ? '' : 'none';
                stopBtn.disabled = status === 'stopping';
            }
            if (executeBtn) executeBtn.disabled = active;
            if (batchBtn) batchBtn.disabled = active;

            // 计时器样式：暂停时变黄并停止脉冲
            if (timerEl) {
                if (status === 'paused') {
                    timerEl.classList.remove('active');
                    timerEl.classList.add('paused');
                } else if (status === 'running') {
                    timerEl.classList.remove('paused');
                    if (taskTimerStart !== null) timerEl.classList.add('active');
                } else if (!active) {
                    timerEl.classList.remove('active');
                    timerEl.classList.remove('paused');
                }
            }

            // 暂停时长计入扣除
            if (status === 'paused' && prev !== 'paused') {
                taskPausedAt = Date.now();
                updateTaskTimer();
            } else if (prev === 'paused' && status !== 'paused') {
                if (taskPausedAt !== null) {
                    taskElapsedOffset += Date.now() - taskPausedAt;
                    taskPausedAt = null;
                }
                updateTaskTimer();
            }

            // 进度变化时立即刷新「预计剩余」
            updateTaskEta();
        }

        // 执行单个任务（返回结果对象，便于批量循环判断是否被停止）
        // internal=true 表示由批量循环调用，跳过「已有任务在执行中」的前置校验
        async function executeTask(taskId, internal = false) {
            if (!internal && taskStatus !== 'idle') {
                addLog('已有任务在执行中，如需重新开始请先点「停止」', 'warning');
                return { success: false, error: '已有任务在执行中' };
            }
            if (!batchRunning) startTaskTimer();
            const taskEl = document.getElementById(`task-${taskId}`);
            if (taskEl) taskEl.classList.add('executing');

            addLog('正在执行任务...', 'info');

            let result = { success: false, error: '未知错误' };
            try {
                result = await ipcRenderer.invoke('execute-task', taskId);

                if (taskEl) {
                    taskEl.classList.remove('executing');
                    if (result.success) {
                        taskEl.classList.add('completed');
                        addLog('✅ 任务执行成功', 'success');
                    } else if (result.aborted) {
                        // 停止提示由 task-completed 事件统一输出，这里不重复
                    } else {
                        addLog('❌ 执行失败: ' + result.error, 'error');
                    }
                }
            } catch (err) {
                addLog('❌ 执行异常: ' + err.message, 'error');
                if (taskEl) taskEl.classList.remove('executing');
                result = { success: false, error: err.message };
            }

            loadStats();
            if (!batchRunning) {
                stopTaskTimer();
                // 刷新「上次耗时」（不立即重绘任务列表，保留刚打上的完成高亮）
                loadTaskDurations(false);
            }
            return result;
        }

        // 执行所有任务
        async function executeAllTasks() {
            if (isExecuting || taskStatus !== 'idle') {
                addLog('已有任务在执行中', 'warning');
                return;
            }

            const enabledTasks = tasks.filter(t => t.enabled);
            if (enabledTasks.length === 0) {
                addLog('没有启用的任务', 'warning');
                return;
            }

            isExecuting = true;
            batchRunning = true;
            startTaskTimer();
            addLog(`开始执行 ${enabledTasks.length} 个任务`, 'info');

            let aborted = false;
            for (let i = 0; i < enabledTasks.length; i++) {
                addLog(`[${i + 1}/${enabledTasks.length}] 执行: ${enabledTasks[i].name || '未命名任务'}`, 'info');
                const result = await executeTask(enabledTasks[i].id, true);
                if (result && result.aborted) { aborted = true; break; }
                await new Promise(r => setTimeout(r, 2000));
            }

            isExecuting = false;
            batchRunning = false;
            stopTaskTimer();
            loadTaskDurations();
            addLog(aborted ? '批量执行已停止' : '全部任务执行完成', aborted ? 'warning' : 'success');
        }
        
        // 切换任务状态
        async function toggleTask(id) {
            const result = await ipcRenderer.invoke('url-toggle', id);
            if (result.success) {
                loadTasks();
                addLog('任务状态已更新', 'success');
            }
        }
        
        // 编辑任务
        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            document.getElementById('task-id').value = task.id;
            document.getElementById('task-name').value = task.name || '';
            currentSteps = task.steps || [];
            renderSteps();
            document.getElementById('task-priority').value = task.priority || 1;
            document.getElementById('modal-title').textContent = '编辑任务';
            document.getElementById('add-modal').classList.add('show');
            ipcRenderer.send('modal-show');
            setTimeout(() => {
                document.getElementById('task-name').focus();
            }, 100);
        }

        // 渲染步骤列表
        function renderSteps() {
            const container = document.getElementById('steps-container');
            if (currentSteps.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">暂无步骤，点击下方按钮添加</div>';
                return;
            }
            
            container.innerHTML = currentSteps.map((step, i) => `
                <div class="step-item">
                    <div class="step-header">
                        <span class="step-number">步骤 ${i + 1}</span>
                        <div>
                            <button type="button" class="btn btn-secondary btn-small" onclick="editStep(${i})" style="padding: 2px 6px; font-size: 10px;">编辑</button>
                            <button type="button" class="step-remove" onclick="removeStep(${i})">×</button>
                        </div>
                    </div>
                    <div class="step-url">${step.url}</div>
                    <div class="step-selectors">
                        ${step.button_selectors?.length ? '按钮: ' + step.button_selectors.join(', ') : ''}
                        ${step.confirm_selectors?.length ? ' | 确认: ' + step.confirm_selectors.join(', ') : ''}
                        ${step.iterate_all ? ` | 🔁 轮询所有(间隔${step.iterate_interval || 10}s${step.iterate_global_unique_count ? (step.iterate_global_batch_size ? `, 全局${step.iterate_global_batch_size}/休息${step.iterate_global_batch_interval || 60}s` : '') : (step.iterate_batch_size ? `, 分批${step.iterate_batch_size}/休息${step.iterate_batch_interval || 60}s` : '')})` : ''}
                        ${step.iterate_open_tabs ? ' | 🔀 新标签页' : ''}
                        ${!step.button_selectors?.length && !step.confirm_selectors?.length ? '无按钮操作' : ''}
                    </div>
                </div>
            `).join('');
        }

        // 全局唯一计数 UI 显隐控制（addStep / editStep 均会调用）
        function updateBatchGroupVisibility() {
            const iterateAll = document.getElementById('step-iterate-all').checked;
            const globalMode = iterateAll && document.getElementById('step-iterate-global').checked;
            document.getElementById('batch-local-group').style.display =
                iterateAll && !globalMode ? 'block' : 'none';
            document.getElementById('batch-global-group').style.display =
                globalMode ? 'block' : 'none';
        }

        // 添加步骤
        function addStep() {
            editingStepIndex = -1;
            document.getElementById('step-url').value = '';
            document.getElementById('step-selectors').value = '';
            document.getElementById('step-confirm-selectors').value = '';
            document.getElementById('step-iterate-all').checked = false;
            document.getElementById('step-iterate-global').checked = false;
            document.getElementById('step-iterate-interval').value = 10;
            document.getElementById('step-iterate-start-index').value = 1;
            document.getElementById('step-iterate-batch-size').value = 10;
            document.getElementById('step-iterate-batch-interval').value = 60;
            document.getElementById('step-iterate-global-size').value = 10;
            document.getElementById('step-iterate-global-interval').value = 60;
            // 新建步骤默认勾选裂变（旧步骤编辑时按实际字段回填，不静默启用）
            document.getElementById('step-iterate-open-tabs').checked = true;
            document.getElementById('iterate-interval-group').style.display = 'none';
            document.getElementById('iterate-start-group').style.display = 'none';
            document.getElementById('iterate-global-group').style.display = 'none';
            updateBatchGroupVisibility();
            document.getElementById('step-modal-title').textContent = '添加步骤';
            document.getElementById('step-modal').classList.add('show');
        }

        // 编辑步骤
        function editStep(index) {
            editingStepIndex = index;
            const step = currentSteps[index];
            document.getElementById('step-url').value = step.url || '';
            document.getElementById('step-selectors').value = (step.button_selectors || []).join('\n');
            document.getElementById('step-confirm-selectors').value = (step.confirm_selectors || []).join('\n');
            document.getElementById('step-iterate-all').checked = !!step.iterate_all;
            document.getElementById('step-iterate-global').checked = step.iterate_global_unique_count === true;
            document.getElementById('step-iterate-interval').value = step.iterate_interval || 10;
            document.getElementById('step-iterate-start-index').value = step.iterate_start_index || 1;
            // 分批字段可选填：旧步骤无字段时留空（placeholder 显示默认），填值才启用分批
            document.getElementById('step-iterate-batch-size').value = step.iterate_batch_size || '';
            document.getElementById('step-iterate-batch-interval').value = step.iterate_batch_interval || '';
            document.getElementById('step-iterate-global-size').value = step.iterate_global_batch_size || '';
            document.getElementById('step-iterate-global-interval').value = step.iterate_global_batch_interval || '';
            // 裂变开关：仅显式为 true 时勾选（旧步骤无字段 → 不勾选，保持原有行为）
            document.getElementById('step-iterate-open-tabs').checked = step.iterate_open_tabs === true;
            document.getElementById('iterate-interval-group').style.display = step.iterate_all ? 'block' : 'none';
            document.getElementById('iterate-start-group').style.display = step.iterate_all ? 'block' : 'none';
            document.getElementById('iterate-global-group').style.display = step.iterate_all ? 'block' : 'none';
            updateBatchGroupVisibility();
            document.getElementById('step-modal-title').textContent = '编辑步骤';
            document.getElementById('step-modal').classList.add('show');
        }

        // 移除步骤
        function removeStep(index) {
            currentSteps.splice(index, 1);
            renderSteps();
        }

        // 步骤表单提交
        document.getElementById('step-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const url = document.getElementById('step-url').value.trim();
            const button_selectors = document.getElementById('step-selectors').value
                .split('\n')
                .map(s => s.trim())
                .filter(s => s);
            const confirm_selectors = document.getElementById('step-confirm-selectors').value
                .split('\n')
                .map(s => s.trim())
                .filter(s => s);
            const iterate_all = document.getElementById('step-iterate-all').checked;
            const iterate_interval = parseInt(document.getElementById('step-iterate-interval').value, 10) || 10;
            const globalMode = iterate_all && document.getElementById('step-iterate-global').checked;

            const step = { url, button_selectors, confirm_selectors, iterate_all, iterate_interval };

            // 起始偏移：仅轮询步骤写入；空/非法按 1 处理
            if (iterate_all) {
                const startIdx = parseInt(document.getElementById('step-iterate-start-index').value, 10);
                step.iterate_start_index = (Number.isInteger(startIdx) && startIdx > 0) ? startIdx : 1;
            }

            if (globalMode) {
                step.iterate_global_unique_count = true;
                const globalBatchSize = parseInt(document.getElementById('step-iterate-global-size').value, 10);
                const globalBatchInterval = parseInt(document.getElementById('step-iterate-global-interval').value, 10);
                if (Number.isInteger(globalBatchSize) && globalBatchSize > 0
                    && Number.isInteger(globalBatchInterval) && globalBatchInterval > 0) {
                    step.iterate_global_batch_size = globalBatchSize;
                    step.iterate_global_batch_interval = globalBatchInterval;
                }
            } else {
                // 分批字段可选填：仅当两组点击/休息均填有效正整数才写入，否则不带字段（保持不分批）
                const batchSize = parseInt(document.getElementById('step-iterate-batch-size').value, 10);
                const batchInterval = parseInt(document.getElementById('step-iterate-batch-interval').value, 10);
                if (iterate_all
                    && Number.isInteger(batchSize) && batchSize > 0
                    && Number.isInteger(batchInterval) && batchInterval > 0) {
                    step.iterate_batch_size = batchSize;
                    step.iterate_batch_interval = batchInterval;
                }
            }

            // 裂变开关：仅勾选时写入字段（未勾选不带字段，保持原有原地轮询行为）
            const openTabs = iterate_all && document.getElementById('step-iterate-open-tabs').checked;
            if (openTabs) {
                step.iterate_open_tabs = true;
            }
            
            if (editingStepIndex === -1) {
                currentSteps.push(step);
            } else {
                currentSteps[editingStepIndex] = step;
            }
            
            document.getElementById('step-modal').classList.remove('show');
            renderSteps();
        });

        // 步骤模态框关闭
        document.getElementById('step-modal-close').addEventListener('click', () => {
            document.getElementById('step-modal').classList.remove('show');
        });
        document.getElementById('step-modal').addEventListener('click', (e) => {
            if (e.target.id === 'step-modal') {
                document.getElementById('step-modal').classList.remove('show');
            }
        });
        
        // 切换任务选择
        function toggleTaskSelection(id) {
            const index = selectedTasks.indexOf(id);
            if (index > -1) {
                selectedTasks.splice(index, 1);
            } else {
                selectedTasks.push(id);
            }
            renderTasks();
            updateSelectAllState();
        }
        
        // 全选/取消全选
        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('select-all');
            if (selectAllCheckbox.checked) {
                selectedTasks = tasks.map(t => t.id);
            } else {
                selectedTasks = [];
            }
            renderTasks();
        }
        
        // 更新全选状态
        function updateSelectAllState() {
            const selectAllCheckbox = document.getElementById('select-all');
            selectAllCheckbox.checked = tasks.length > 0 && selectedTasks.length === tasks.length;
        }
        
        // 批量执行选中的任务
        async function executeSelectedTasks() {
            if (isExecuting || taskStatus !== 'idle') {
                addLog('已有任务在执行中', 'warning');
                return;
            }

            if (selectedTasks.length === 0) {
                addLog('请先选择要执行的任务', 'warning');
                return;
            }

            isExecuting = true;
            batchRunning = true;
            startTaskTimer();
            addLog(`开始批量执行 ${selectedTasks.length} 个任务`, 'info');

            let aborted = false;
            for (let i = 0; i < selectedTasks.length; i++) {
                const task = tasks.find(t => t.id === selectedTasks[i]);
                addLog(`[${i + 1}/${selectedTasks.length}] 执行: ${task.name || task.url}`, 'info');
                const result = await executeTask(selectedTasks[i], true);
                if (result && result.aborted) { aborted = true; break; }
                await new Promise(r => setTimeout(r, 2000));
            }

            isExecuting = false;
            batchRunning = false;
            stopTaskTimer();
            selectedTasks = [];
            renderTasks();
            loadTaskDurations();
            addLog(aborted ? '批量执行已停止' : '批量执行完成', aborted ? 'warning' : 'success');
        }
        
        // 删除任务
        async function deleteTask(id) {
            if (!confirm('确定删除此任务？')) return;
            const result = await ipcRenderer.invoke('url-delete', id);
            if (result.success) {
                loadTasks();
                addLog('任务已删除', 'success');
            }
        }
        
        // 添加日志
        function addLog(message, type = 'info') {
            const container = document.getElementById('log-container');
            const time = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = `log-item log-${type}`;
            item.innerHTML = `<span class="log-time">${time}</span>${message}`;
            container.appendChild(item);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
