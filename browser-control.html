<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器自动化控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        
        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        /* 状态面板 */
        .status-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #252542;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
            transition: all 0.3s;
        }
        
        .status-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .status-card .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .status-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .status-card .label {
            color: #888;
            margin-top: 5px;
        }
        
        /* 主控制区 */
        .main-controls {
            background: #252542;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        
        .control-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-row:last-child {
            margin-bottom: 0;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #3a3a5c;
            color: #fff;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-large {
            padding: 18px 36px;
            font-size: 18px;
        }
        
        /* 预登录区域 */
        .prelogin-section {
            background: #1e1e35;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .prelogin-section h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .input-group input {
            flex: 1;
            min-width: 300px;
            padding: 14px 18px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #2a2a4a;
            color: #fff;
            font-size: 15px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-group input::placeholder {
            color: #666;
        }
        
        /* 任务列表 */
        .tasks-section {
            background: #252542;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #333;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .section-header h2 {
            font-size: 22px;
        }
        
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .task-item {
            background: #1e1e35;
            padding: 18px 22px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .task-item:hover {
            border-color: #444;
        }
        
        .task-item.executing {
            border-color: #667eea;
            background: #2a2a4a;
            animation: pulse 2s infinite;
        }
        
        .task-item.completed {
            border-color: #38ef7d;
        }
        
        .task-item.failed {
            border-color: #f45c43;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(102, 126, 234, 0); }
        }
        
        .task-info {
            flex: 1;
        }
        
        .task-url {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .task-selectors {
            font-size: 13px;
            color: #888;
            font-family: monospace;
        }
        
        .task-status {
            font-size: 13px;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
        }
        
        .task-status.pending {
            background: #3a3a5c;
            color: #888;
        }
        
        .task-status.executing {
            background: #667eea;
            color: white;
        }
        
        .task-status.completed {
            background: #11998e;
            color: white;
        }
        
        .task-status.failed {
            background: #eb3349;
            color: white;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 10px 18px;
            font-size: 14px;
        }
        
        /* 日志区域 */
        .logs-section {
            background: #0d0d1a;
            border-radius: 16px;
            padding: 25px;
            margin-top: 30px;
            border: 1px solid #333;
        }
        
        .logs-container {
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
        }
        
        .log-item {
            padding: 6px 0;
            border-bottom: 1px solid #222;
        }
        
        .log-time {
            color: #666;
            margin-right: 12px;
        }
        
        .log-info { color: #fff; }
        .log-success { color: #38ef7d; }
        .log-error { color: #f45c43; }
        .log-warning { color: #f9ca24; }
        .log-browser { color: #74b9ff; }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #252542;
            padding: 35px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #444;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .modal-title {
            font-size: 22px;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #aaa;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #1e1e35;
            color: #fff;
            font-size: 15px;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
            font-family: monospace;
        }
        
        .form-hint {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
        
        /* 开关 */
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toggle-switch input[type="checkbox"] {
            width: 50px;
            height: 26px;
            appearance: none;
            background: #444;
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle-switch input[type="checkbox"]:checked {
            background: #667eea;
        }
        
        .toggle-switch input[type="checkbox"]::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        
        .toggle-switch input[type="checkbox"]:checked::after {
            transform: translateX(24px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 浏览器自动化控制台</h1>
            <p>支持预登录、浏览器复用、连续任务执行</p>
        </header>
        
        <!-- 状态面板 -->
        <div class="status-panel">
            <div class="status-card">
                <div class="icon">📋</div>
                <div class="value" id="stat-total">0</div>
                <div class="label">任务总数</div>
            </div>
            <div class="status-card">
                <div class="icon">✅</div>
                <div class="value" id="stat-enabled">0</div>
                <div class="label">已启用</div>
            </div>
            <div class="status-card">
                <div class="icon">🌐</div>
                <div class="value" id="stat-browser">关闭</div>
                <div class="label">浏览器状态</div>
            </div>
            <div class="status-card">
                <div class="icon">📊</div>
                <div class="value" id="stat-today">0</div>
                <div class="label">今日执行</div>
            </div>
        </div>
        
        <!-- 主控制区 -->
        <div class="main-controls">
            <!-- 预登录区域 -->
            <div class="prelogin-section">
                <h3>🔓 预登录 / 预打开</h3>
                <p style="color: #888; margin-bottom: 15px; font-size: 14px;">
                    先打开浏览器访问登录页面，完成登录后再执行其他任务（Cookie会被保留）
                </p>
                <div class="input-group">
                    <input type="url" id="prelogin-url" placeholder="https://example.com/login">
                    <button class="btn btn-secondary" onclick="preOpenBrowser()">
                        🌐 打开浏览器
                    </button>
                </div>
            </div>
            
            <!-- 批量执行控制 -->
            <div class="control-row">
                <button class="btn btn-success btn-large" onclick="launchBrowser()" id="btn-launch">
                    🚀 启动浏览器
                </button>
                <button class="btn btn-primary btn-large" onclick="executeAllTasks()" id="btn-execute">
                    ▶️ 执行所有任务
                </button>
                <button class="btn btn-warning btn-large" onclick="executeAllTasks(true)" id="btn-force">
                    🔄 强制重新执行
                </button>
                <button class="btn btn-danger btn-large" onclick="closeBrowser()" id="btn-close">
                    ❌ 关闭浏览器
                </button>
            </div>
            
            <div class="control-row">
                <div class="toggle-switch">
                    <input type="checkbox" id="continuous-mode" checked>
                    <label for="continuous-mode">连续模式（不关闭浏览器）</label>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="show-browser" checked>
                    <label for="show-browser">显示浏览器窗口</label>
                </div>
            </div>
        </div>
        
        <!-- 任务列表 -->
        <div class="tasks-section">
            <div class="section-header">
                <h2>📋 任务列表</h2>
                <button class="btn btn-primary" onclick="openAddModal()">➕ 添加任务</button>
            </div>
            <div class="task-list" id="task-list">
                <div style="text-align: center; padding: 40px; color: #666;">
                    正在加载任务列表...
                </div>
            </div>
        </div>
        
        <!-- 执行日志 -->
        <div class="logs-section">
            <div class="section-header">
                <h2>📜 执行日志</h2>
                <button class="btn btn-secondary btn-small" onclick="clearLogs()">清空</button>
            </div>
            <div class="logs-container" id="logs-container">
                <div class="log-item log-info">
                    <span class="log-time">等待开始...</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加任务模态框 -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">➕ 添加新任务</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="add-form" onsubmit="saveTask(event)">
                <div class="form-group">
                    <label>网页地址 (URL)</label>
                    <input type="url" id="task-url" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>按钮选择器（每行一个，按顺序尝试）</label>
                    <textarea id="task-selectors" placeholder=".btn-submit
#submit-button
button[type='submit']"></textarea>
                    <div class="form-hint">CSS选择器，用于查找并点击页面上的按钮</div>
                </div>
                <div class="form-group">
                    <label>优先级（数字越大越优先）</label>
                    <input type="number" id="task-priority" value="1" min="1" max="100">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    保存任务
                </button>
            </form>
        </div>
    </div>
    
    <script>
        // 全局状态
        let tasks = [];
        let isExecuting = false;
        let isBrowserOpen = false;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            // 检查是否通过HTTP访问
            if (window.location.protocol === 'file:') {
                addLog('❌ 错误：直接打开了HTML文件', 'error');
                addLog('💡 请启动服务器后访问: http://localhost:8080/control', 'warning');
                alert('请通过 http://localhost:8080/control 访问控制面板\n不要直接双击打开HTML文件');
                return;
            }
            
            // 检查API连接
            const isConnected = await checkApiConnection();
            if (!isConnected) {
                addLog('❌ 无法连接到服务器 (端口8080)', 'error');
                addLog('💡 请确保服务器已启动: node src/web/server.js', 'warning');
            } else {
                addLog('✅ 已连接到服务器', 'success');
                loadTasks();
                loadStats();
            }
        });
        
        // 加载任务
        async function loadTasks() {
            try {
                const res = await fetch('/api/urls');
                const data = await res.json();
                
                if (data.success) {
                    tasks = data.data;
                    renderTasks();
                    updateStats();
                }
            } catch (err) {
                addLog('加载任务失败: ' + err.message, 'error');
            }
        }
        
        // 渲染任务列表
        function renderTasks() {
            const container = document.getElementById('task-list');
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <div style="font-size: 48px; margin-bottom: 16px;">📭</div>
                        <p>暂无任务，点击右上角"添加任务"按钮开始</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = tasks.map((task, index) => `
                <div class="task-item" id="task-${task.id}" data-url="${task.url}">
                    <div class="task-info">
                        <div class="task-url">
                            <span style="color: #667eea;">#${index + 1}</span>
                            ${task.url}
                            ${task.enabled ? 
                                '<span style="color: #38ef7d; font-size: 12px;">✓ 启用</span>' : 
                                '<span style="color: #666; font-size: 12px;">✗ 禁用</span>'}
                        </div>
                        <div class="task-selectors">
                            ${task.button_selectors && task.button_selectors.length > 0 ? 
                                task.button_selectors.join(' | ') : '无按钮选择器'}
                        </div>
                        <div class="task-status pending" id="status-${task.id}">
                            等待执行
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn btn-success btn-small" onclick="executeTask(${task.id})">
                            ▶ 执行
                        </button>
                        <button class="btn btn-secondary btn-small" onclick="toggleTask(${task.id})">
                            ${task.enabled ? '禁用' : '启用'}
                        </button>
                        <button class="btn btn-danger btn-small" onclick="deleteTask(${task.id})">
                            删除
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // 加载统计
        async function loadStats() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('stat-total').textContent = data.data.urls.total;
                    document.getElementById('stat-enabled').textContent = data.data.urls.enabled;
                    document.getElementById('stat-today').textContent = data.data.today.total;
                }
            } catch (err) {
                console.error('加载统计失败:', err);
            }
        }
        
        function updateStats() {
            const enabled = tasks.filter(t => t.enabled).length;
            document.getElementById('stat-total').textContent = tasks.length;
            document.getElementById('stat-enabled').textContent = enabled;
        }
        
        // 添加日志
        function addLog(message, type = 'info') {
            const container = document.getElementById('logs-container');
            const time = new Date().toLocaleTimeString();
            
            const logItem = document.createElement('div');
            logItem.className = `log-item log-${type}`;
            logItem.innerHTML = `<span class="log-time">${time}</span>${message}`;
            
            container.appendChild(logItem);
            container.scrollTop = container.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('logs-container').innerHTML = '';
        }
        
        // 检查API是否可用
        async function checkApiConnection() {
            try {
                const res = await fetch('/api/status', { method: 'GET' });
                return res.ok;
            } catch (err) {
                return false;
            }
        }
        
        // 启动浏览器
        async function launchBrowser() {
            // 先检查连接
            const isConnected = await checkApiConnection();
            if (!isConnected) {
                addLog('❌ 无法连接到服务器', 'error');
                addLog('💡 请通过 http://localhost:8080/control 访问此页面', 'warning');
                addLog('💡 不要直接双击打开HTML文件', 'warning');
                alert('请通过 http://localhost:8080/control 访问控制面板\n不要直接双击打开HTML文件');
                return;
            }
            
            addLog('正在启动浏览器...', 'browser');
            try {
                const res = await fetch('/api/browser/launch', { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    isBrowserOpen = true;
                    document.getElementById('stat-browser').textContent = '运行中';
                    document.getElementById('stat-browser').style.color = '#38ef7d';
                    addLog('✅ 浏览器启动成功', 'success');
                } else {
                    addLog('❌ 启动失败: ' + data.error, 'error');
                }
            } catch (err) {
                addLog('❌ 启动失败: ' + err.message, 'error');
            }
        }
        
        // 预打开浏览器
        async function preOpenBrowser() {
            const url = document.getElementById('prelogin-url').value.trim();
            if (!url) {
                addLog('⚠️ 请输入URL', 'warning');
                return;
            }
            
            addLog(`正在打开浏览器访问: ${url}`, 'browser');
            try {
                const res = await fetch('/api/browser/preopen', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    isBrowserOpen = true;
                    document.getElementById('stat-browser').textContent = '运行中';
                    addLog('✅ 浏览器已打开，请完成登录操作', 'success');
                    addLog('💡 登录完成后可以执行其他任务', 'info');
                } else {
                    addLog('❌ 打开失败: ' + data.error, 'error');
                }
            } catch (err) {
                addLog('❌ 打开失败: ' + err.message, 'error');
            }
        }
        
        // 执行单个任务
        async function executeTask(taskId) {
            if (isExecuting) {
                addLog('⚠️ 正在执行中，请等待', 'warning');
                return;
            }
            
            const taskEl = document.getElementById(`task-${taskId}`);
            if (taskEl) {
                taskEl.classList.add('executing');
                document.getElementById(`status-${taskId}`).textContent = '执行中...';
                document.getElementById(`status-${taskId}`).className = 'task-status executing';
            }
            
            addLog(`开始执行任务 #${taskId}...`, 'browser');
            
            try {
                const res = await fetch('/api/browser/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    addLog(`✅ 任务执行成功`, 'success');
                    if (taskEl) {
                        taskEl.classList.remove('executing');
                        taskEl.classList.add('completed');
                        document.getElementById(`status-${taskId}`).textContent = '已完成';
                        document.getElementById(`status-${taskId}`).className = 'task-status completed';
                    }
                } else {
                    addLog('❌ 执行失败: ' + data.error, 'error');
                    if (taskEl) {
                        taskEl.classList.remove('executing');
                        taskEl.classList.add('failed');
                        document.getElementById(`status-${taskId}`).textContent = '失败';
                        document.getElementById(`status-${taskId}`).className = 'task-status failed';
                    }
                }
            } catch (err) {
                addLog('❌ 执行失败: ' + err.message, 'error');
                if (taskEl) {
                    taskEl.classList.remove('executing');
                    taskEl.classList.add('failed');
                }
            }
            
            loadStats();
        }
        
        // 执行所有任务
        async function executeAllTasks(force = false) {
            if (isExecuting) {
                addLog('⚠️ 正在执行中，请等待', 'warning');
                return;
            }
            
            const enabledTasks = tasks.filter(t => t.enabled);
            if (enabledTasks.length === 0) {
                addLog('⚠️ 没有启用的任务', 'warning');
                return;
            }
            
            isExecuting = true;
            addLog(`🚀 开始批量执行 ${enabledTasks.length} 个任务${force ? ' (强制模式)' : ''}...`, 'browser');
            
            for (let i = 0; i < enabledTasks.length; i++) {
                const task = enabledTasks[i];
                addLog(`[${i + 1}/${enabledTasks.length}] 执行: ${task.url}`, 'info');
                
                await executeTask(task.id);
                
                if (i < enabledTasks.length - 1) {
                    addLog('⏳ 等待2秒...', 'info');
                    await sleep(2000);
                }
            }
            
            isExecuting = false;
            addLog('✅ 批量执行完成', 'success');
        }
        
        // 关闭浏览器
        async function closeBrowser() {
            addLog('正在关闭浏览器...', 'browser');
            try {
                const res = await fetch('/api/browser/close', { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    isBrowserOpen = false;
                    document.getElementById('stat-browser').textContent = '关闭';
                    document.getElementById('stat-browser').style.color = '';
                    addLog('✅ 浏览器已关闭', 'success');
                }
            } catch (err) {
                addLog('❌ 关闭失败: ' + err.message, 'error');
            }
        }
        
        // 切换任务状态
        async function toggleTask(id) {
            try {
                const res = await fetch(`/api/urls/${id}/toggle`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    loadTasks();
                    addLog('任务状态已更新', 'success');
                }
            } catch (err) {
                addLog('操作失败: ' + err.message, 'error');
            }
        }
        
        // 删除任务
        async function deleteTask(id) {
            if (!confirm('确定要删除这个任务吗？')) return;
            
            try {
                const res = await fetch(`/api/urls/${id}`, { method: 'DELETE' });
                const data = await res.json();
                
                if (data.success) {
                    loadTasks();
                    addLog('任务已删除', 'success');
                }
            } catch (err) {
                addLog('删除失败: ' + err.message, 'error');
            }
        }
        
        // 模态框
        function openAddModal() {
            document.getElementById('add-modal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('add-modal').classList.remove('show');
        }
        
        // 保存任务
        async function saveTask(e) {
            e.preventDefault();
            
            const url = document.getElementById('task-url').value;
            const selectors = document.getElementById('task-selectors').value;
            const priority = document.getElementById('task-priority').value;
            
            try {
                const res = await fetch('/api/urls', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url,
                        button_selectors: selectors.split('\n').map(s => s.trim()).filter(s => s),
                        priority: parseInt(priority),
                        enabled: true
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    closeModal();
                    loadTasks();
                    addLog('✅ 任务添加成功', 'success');
                    document.getElementById('add-form').reset();
                } else {
                    addLog('❌ 添加失败: ' + data.error, 'error');
                }
            } catch (err) {
                addLog('❌ 添加失败: ' + err.message, 'error');
            }
        }
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // 点击模态框外部关闭
        document.getElementById('add-modal').addEventListener('click', (e) => {
            if (e.target.id === 'add-modal') closeModal();
        });
    </script>
</body>
</html>
